<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Thylacine OG</title>
<style>
@font-face{font-family:"Instrument Sans";src:url("../fonts/instrument-sans-latin-500-normal.woff2") format("woff2");font-weight:500}
@font-face{font-family:"Instrument Sans";src:url("../fonts/instrument-sans-latin-700-normal.woff2") format("woff2");font-weight:700}
:root{--bg:oklch(0.15 0.012 65);--bg-deep:oklch(0.10 0.01 65);--text:oklch(0.95 0.02 78);--dim:oklch(0.80 0.025 70);--accent:oklch(0.78 0.14 72);--stripe:oklch(0.36 0.03 65)}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:radial-gradient(120% 80% at 50% 105%,oklch(0.24 0.05 65),var(--bg) 55%,var(--bg-deep));font-family:"Instrument Sans",sans-serif;color:var(--text);position:relative}
.eyebrow{position:absolute;left:72px;top:72px;font-weight:700;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
h1{position:absolute;left:72px;top:124px;width:1000px;font-weight:700;font-size:82px;line-height:.98;letter-spacing:-.02em;text-transform:uppercase}
.bars{position:absolute;left:72px;right:72px;bottom:72px;height:56px;display:flex;justify-content:space-between;align-items:flex-end}
.bars i{display:block;width:6px;background:var(--stripe)}
.bars i.hi{background:var(--accent)}
.url{position:absolute;right:72px;bottom:140px;font-weight:500;font-size:22px;color:var(--dim)}
</style></head><body>
<div class="eyebrow">Thylacine</div>
<h1>Software products and bespoke digital solutions.</h1>
<div class="url">github.com/thylacinehq</div>
<div class="bars" id="b"></div>
<script>const b=document.getElementById('b');for(let i=0;i<68;i++){const e=document.createElement('i');if(i===27)e.className='hi';e.style.height=(i===27?100:70+((i*37)%30))+'%';b.appendChild(e)}</script>
</body></html>
